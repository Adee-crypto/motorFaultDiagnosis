# Mosquitto broker settings (step 2).
# Accepts MQTT on port 1883 from anyone, without a password.
# That's fine on your own PC for now; step 8 adds logins and encryption.
listener 1883 0.0.0.0
allow_anonymous true

# Keep messages for subscribers that are briefly offline, across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
