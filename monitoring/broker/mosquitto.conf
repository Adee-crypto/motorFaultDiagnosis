# Mosquitto settings (step 8: TLS + logins + topic rules).
# In Docker this folder is mounted at /broker, and the start command copies the
# certificates, passwords and acl into /mosquitto/secure/ first (see docker-compose.yml).

# --- one listener, encrypted (TLS) on port 8883; no unencrypted port any more
listener 8883
certfile /mosquitto/secure/broker.crt
keyfile  /mosquitto/secure/broker.key
cafile   /mosquitto/secure/ca.crt
tls_version tlsv1.2

# --- logins: no anonymous clients; every client needs a user name + password
allow_anonymous false
password_file /mosquitto/secure/passwd

# --- topic rules: who may read and write which topics (see acl)
acl_file /mosquitto/secure/acl

# --- keep queued messages across broker restarts (step 3)
persistence true
persistence_location /mosquitto/data/
max_queued_messages 10000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
